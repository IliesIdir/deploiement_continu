# Services utilisés en local et dans la CI : la base et le S3 local.
# Les scripts Python tournent directement sur la machine (ou le runner GitHub).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    # Le healthcheck permet à "docker compose up --wait" d'attendre que la base soit prête
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transactions"]
      interval: 2s
      timeout: 5s
      retries: 15

  s3:
    # SeaweedFS en mode "tout en un" avec l'API S3 activée sur le port 8333
    image: chrislusf/seaweedfs:latest
    command: server -s3
    ports:
      - "8333:8333"
